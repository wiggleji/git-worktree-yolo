name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure shellcheck
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Lint production scripts (strict)
        run: shellcheck --severity=warning --shell=bash install.sh skills/git-worktree-yolo/git-worktree-yolo.sh
      - name: Lint test scripts (exclude SC2034 — vars used inside eval strings)
        run: shellcheck --severity=warning --shell=bash --exclude=SC2034 skills/git-worktree-yolo/simulate.sh skills/git-worktree-yolo/test-*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # bash 5.x (Linux) and bash 3.2 (macOS)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Environment
        run: |
          # macOS ships bash 3.2 at /bin/bash — pin to it so we actually test 3.2 compatibility
          BASH_BIN=bash
          [ "$RUNNER_OS" = "macOS" ] && BASH_BIN=/bin/bash
          echo "BASH_BIN=$BASH_BIN" >> "$GITHUB_ENV"
          "$BASH_BIN" --version | head -1
          git --version
          perl --version | sed -n '2p'
      - name: Run all test harnesses
        run: |
          set -e
          fail=0
          for t in simulate test-global-hook test-multistack test-secret-guard test-advisory test-concurrency; do
            echo "::group::$t ($BASH_BIN)"
            "$BASH_BIN" "skills/git-worktree-yolo/$t.sh" || fail=1
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ] || { echo "::error::one or more harnesses failed"; exit 1; }
